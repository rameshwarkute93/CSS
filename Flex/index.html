<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>
            *{
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            section{
                height: 500px;  
                display: flex;
                flex-wrap: wrap;
                justify-content: space-evenly;
                align-items: center;
                border: 1px solid red;
            }
            div{
                border: 1px solid rebeccapurple;
                height: 100px;
                width: 100%;
                text-align: center;
            }
            @media only screen and (min-width:992px){
                div{
                    width: 23%;
                }
            }

            #first{
                display: flex;
                flex-wrap: wrap;
                justify-content: space-evenly;
                align-items: center;
                
            }
            section div div{
                height: 50%;
                width: 40%;
                
            }

        </style>
    </head>
    <body>
        <section>
            <div id="first">
                <div>1.1</div>
                <div>1.2</div>
            </div>
            <div>2</div>
            <div>3</div>
            <div>4</div>
        </section>

    </body>
</html>

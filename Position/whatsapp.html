<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
            integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
            crossorigin="anonymous" referrerpolicy="no-referrer">
    </head>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        div{
            
            height: 100vh;
            border: 1px solid red;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;

        }
        i{
            font-size: 500px;
            position: relative;
        }
        span{
            font-size: 50px;
            position: absolute;
            top: -1px;
            right:60px;
            background-color: aqua;
            border-radius: 50%;
            height: 100px;
            width: 100px;
            padding: 20px;
        }

    </style>
    <body>
        <div>
            <i
                class="fa-brands fa-square-whatsapp"><span>50<sup>+</sup></span></i>
        </div>
    </body>
</html>

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <style>
        *{
            box-sizing: border-box;
            margin: 0px;
            padding: 0px;
        }
        section{
            position: relative;
            border: 2px solid red;
            height: 100vh;
        }

        div{
            position: absolute;
            height: 100px;
            width: 100px;
            border: 1px solid red;
        }

        #one{
            left: 0px;
            top: 0px;
            background-color: aqua;
        }

        #two{
            left: 50%;
            top: 0px;
            background-color: rgb(0, 255, 0);
        }

        #three{
            top: 0px;
            right: 0px;
            background-color: rgba(255, 204, 0, 0.709);
        }

        #four{
            top: 50%;
            left: 0px;
            background-color: rgb(140, 0, 255);
        }

        #five{
            top: 50%;
            left: 50%;
            background-color: rgb(132, 0, 255);
        }

        #six{
            top: 50%;
            right:0px;
            background-color: rgb(0, 255, 115);
        }

        #seven{
            bottom: 0px;
            left: 0px;
            background-color: rgb(255, 0, 21);
        }

        #egiht{
            bottom: 0px;
            left: 50%;
            background-color: rgb(106, 0, 255);
        }

        #nine{
            bottom: 0px;
            right: 0px;
            background-color: rgb(0, 81, 255);
        }
    </style>
    <body>
        <section>
            <div id="one">1
            </div>

            <div id="two">2
            </div>

            <div id="three">3</div>

            <div id="four">4</div>

            <div id="five">5</div>

            <div id="six">6</div>

            <div id="seven">7</div>

            <div id="egiht">8</div>

            <div id="nine">9</div>
        </section>
    </body>
</html>

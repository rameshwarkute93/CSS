<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
            integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <section id="header">

                <div id="logo">
                    <i class="fa-solid fa-person-chalkboard"></i>
                    <span>Adward</span>
                </div>

                <nav id="navlinks">
                    <a href="#hero_section">Home</a>
                    <a href="about.html">About</a>
                    <a href="teacher.html">Teacher</a>
                    <a href="vehicle.html">Vehicle</a>
                    <a href="contact.html">Contact Us</a>

                    <i class="fa-solid fa-magnifying-glass"></i>
                </nav>

            </section>
        </header>

        <main>
            <section id="contact">

                <div class="contact-content">

                    <h1>Contact Now</h1>

                    <p>
                        Get in touch with us for more information about
                        our school and facilities.
                    </p>

                </div>

                <div class="contact-form">

                    <form>

                        <input type="text"
                            placeholder="Name"
                            required>

                        <input type="tel"
                            placeholder="Phone Number"
                            required>

                        <input type="email"
                            placeholder="Email"
                            required>

                        <textarea
                            placeholder="Message"
                            rows="8"
                            required></textarea>

                        <button type="submit">Send</button>

                    </form>

                </div>

            </section>
        </main>

        <!-- <footer>

    </body>
</html>
